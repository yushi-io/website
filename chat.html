<pre id=l></pre>
<input id=i onkeydown="if(event.key=='Enter' && i.socket?.readyState===WebSocket.OPEN){
  l.textContent+=value+'\n';
  i.socket.send(JSON.stringify({
    type:'conversation.item.create',
    item:{type:'message',role:'user',content:[{type:'input_text',text:value}]}
  }));
  i.socket.send(JSON.stringify({type:'response.create',response:{output_modalities:['text']}}));
  value='';
}">
<script>
let token = new URLSearchParams(location.hash.slice(1)).get('token')?.trim();
if (!token) token = prompt()?.trim();
if (token) {
  i.socket = new WebSocket('wss://api.openai.com/v1/realtime?model=gpt-realtime-2.1',
    ['realtime', 'openai-insecure-api-key.' + token]);
  i.socket.onmessage = function(event) {
    const reply = JSON.parse(event.data);
    if (reply.type === 'response.output_text.done') l.textContent += reply.text + '\n';
  };
}
</script>
